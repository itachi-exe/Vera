[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# Monad is EVM-equivalent through Cancun. Do not raise past this.
evm_version = "cancun"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    # The deploy also writes the receipt here, because this is the path the
    # frontend actually fetches (/deployments/<chainid>.json). Addresses only.
    { access = "read-write", path = "../vera-frontend/public/deployments" },
    # Rate parity fixtures, generated from vera-frontend/lib/vera.js. Read-only on purpose:
    # the Solidity side must never be able to rewrite the table it is checked against.
    { access = "read", path = "./test/fixtures" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"

[etherscan]
monad = {key = "${MONAD_EXPLORER_KEY}", url = "${MONAD_EXPLORER_URL}", chain = 10143}
